<html lang="ar" dir="rtl"><head><meta charset="utf-8">

<title>مطبخ طازة</title>
<style>
:root{--bg:#faf7f2;--cd:#fff;--tx:#1f1a17;--mu:#78716c;--ac:#c2410c;--bd:#e7e0d6;--rd:#dc2626}
@media (prefers-color-scheme:dark){:root{--bg:#1a1613;--cd:#26211d;--tx:#f5efe8;--mu:#a8a29e;--ac:#fb923c;--bd:#3a332d;--rd:#f87171}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:Tahoma,Arial,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
header{background:var(--ac);color:#fff;padding:14px 16px;font-weight:700;font-size:18px}
nav{display:flex;gap:6px;padding:10px 12px;overflow-x:auto}
nav button{flex:0 0 auto;padding:9px 14px;border:1px solid var(--bd);background:var(--cd);color:var(--tx);border-radius:10px;font:inherit}
nav button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
main{padding:0 12px 24px;max-width:960px;margin:auto}
.c{background:var(--cd);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:12px}
.r{display:flex;gap:8px;flex-wrap:wrap}
input,select{flex:1;min-width:90px;padding:9px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
td input,td select{min-width:70px;width:100%}
.b{padding:10px 16px;border:0;border-radius:8px;background:var(--ac);color:#fff;font:inherit;cursor:pointer}
.x{background:none;color:var(--rd);padding:4px 8px}
.t{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
.t div{background:var(--bg);border-radius:8px;padding:8px;text-align:center}.t b{display:block;font-size:18px}.t span,.m{color:var(--mu);font-size:12px}
.s{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:6px;border-bottom:1px solid var(--bd);text-align:center;white-space:nowrap}th{color:var(--mu)}
.w{color:var(--rd);font-weight:700}
#inv:empty{display:none}#inv>div{position:fixed;inset:0;background:var(--bg);z-index:9;padding:20px;overflow:auto}
@media print{body>*:not(#inv){display:none}.no{display:none}#inv>div{position:static}}
</style></head><body>

let sc='',sy='',busy=false,tm;try{sc=localStorage.getItem('taza-sync')||''}catch(e){}

const ST=['جديد','جاري التحضير','تم التوصيل'],PY=['كاش','فودافون كاش','إنستا باي'];
mig();let unlocked=!S.pin,cart=[],fm={cu:'',v:'',py:'كاش'},rp='7';
const TABS=[['s','المبيعات'],['c','العملاء'],['p','التقارير'],['m','الوجبات'],['r','الوصفات'],['i','الخامات'],['v','المخزون'],['b','النسخ والإعدادات']];

function draw(){
 if(!unlocked){$('nav').innerHTML='';$('app').innerHTML='<div class="c r"><input id="pw" type="password" inputmode="numeric" placeholder="الرقم السري"><button class="b" onclick="ul()">دخول</button></div>';return}
 $('nav').innerHTML=TABS.map(t=>`<button class="${t[0]==tab?'on':''}" onclick="go('${t[0]}')">${t[1]}</button>`).join('');
 $('app').innerHTML=({s:sales,m:meals,r:recipes,i:ings,v:stock,b:backup,c:custs,p:reports})[tab]();
}
const cn=id=>(S.cust.find(c=>c.id===id)||{}).n||'',sel=(a,v,fn)=>`<select onchange="${fn}">${a.map(x=>`<option ${x==v?'selected':''}>${x}</option>`).join('')}</select>`;
function sales(){
 const os=S.orders.filter(o=>o.d===day);let rv=0,cs=0,dl=0;os.forEach(o=>{rv+=oT(o);cs+=oC(o);dl+=o.v||0});
 const low=S.ing.filter(i=>i.o-used(i)<=i.r);
 const rows=os.map(o=>`<tr><td>${o.t}</td><td>${o.d}</td><td>${cn(o.cu)}</td><td style="white-space:normal">${o.items.map(x=>x.n+' ×'+x.q).join('، ')}</td><td>${f(oT(o))}</td><td>${f(oP(o))}</td><td>${o.v?f(o.v):''}</td><td>${sel(ST,o.st,`sO('${o.id}','st',this.value)`)}</td><td>${sel(PY,o.pay,`sO('${o.id}','pay',this.value)`)}</td><td><button class="b x" onclick="inv('${o.id}')">🧾</button><button class="b x" onclick="dO('${o.id}')">✕</button></td></tr>`).join('');
 return (low.length?`<div class="c"><b class="w">⚠️ ${low.length} مكون وصل لحد الطلب</b><p class="m">${low.map(i=>i.n+' (باقي '+f(i.o-used(i))+')').join('، ')}</p><button class="b" onclick="shopL()">مشاركة قايمة المشتريات</button></div>`:'')
 +`<div class="c"><div class="r"><select id="ml">${S.meals.map(m=>`<option value="${m.id}">${m.n}</option>`).join('')}</select><input id="q" type="number" min="1" value="1"><button class="b" onclick="aC()">+ أضف للأوردر</button></div>
 <p>${cart.map((x,i)=>`${x.n} ×${x.q} <button class="b x" onclick="cx(${i})">✕</button>`).join(' | ')||'<span class="m">الأوردر فاضي</span>'}</p>
 <div class="r"><select onchange="fm.cu=this.value"><option value="">بدون عميل</option>${S.cust.map(c=>`<option value="${c.id}" ${c.id===fm.cu?'selected':''}>${c.n}</option>`).join('')}</select><input type="number" placeholder="التوصيل" value="${fm.v}" onchange="fm.v=this.value">${sel(PY,fm.py,'fm.py=this.value')}<button class="b" onclick="aO()">تسجيل الأوردر</button></div>

 <div class="c"><input type="date" value="${day}" onchange="day=this.value;draw()"></div>
 <div class="c t">${[['الأوردرات',os.length],['المبيعات',f(rv)],['التكلفة',f(cs)],['صافي الربح',f(rv-cs)],['التوصيل',f(dl)]].map(x=>`<div><span>${x[0]}</span><b>${x[1]}</b></div>`).join('')}</div>`
 +tbl(['الساعة','التاريخ','العميل','الأصناف','الإجمالي','الربح','التوصيل','الحالة','الدفع',''],rows);
}
window.aC=()=>{const m=S.meals.find(x=>x.id===$('ml').value);if(!m)return;cart.push({m:m.id,n:m.n,q:+$('q').value||1,s:price(m),c:tot(m)});draw()};
window.cx=i=>{cart.splice(i,1);draw()};
window.aO=()=>{if(!cart.length)return alert('أضف وجبة للأوردر الأول');const n=new Date();S.orders.push({id:uid(),d:dstr(n),t:tstr(n),cu:fm.cu,st:'جديد',pay:fm.py,v:+fm.v||0,items:cart});cart=[];fm.v='';day=dstr(n);save();draw()};

function backup(){
 return `<div class="c"><h3>نقل البيانات لتليفون تاني</h3><p class="m">1) من التليفون القديم اضغط تصدير، هينزل ملف. 2) ابعته لنفسك (واتساب أو إيميل). 3) افتح التطبيق على التليفون الجديد واضغط استيراد واختار الملف.</p>
 <div class="r"><button class="b" onclick="exJ()">⬇️ تصدير نسخة احتياطية</button><button class="b" onclick="$('fi').click()">⬆️ استيراد نسخة</button><input id="fi" type="file" accept=".json,application/json" hidden onchange="imJ(this.files[0])"></div></div>

 <div class="c"><b>🔒 قفل بالرقم السري</b><div class="r"><input id="pn" type="password" inputmode="numeric" placeholder="رقم سري جديد"><button class="b" onclick="sP()">حفظ</button>${S.pin?'<button class="b x" onclick="sP(1)">إلغاء القفل</button>':''}</div><p class="m">قفل بسيط لمنع الفتح بالغلط، مش حماية قوية. الرقم مش بيتنقل مع النسخة الاحتياطية.</p></div>`;

const dl=(name,txt,type)=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type}));a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000)};

 if(!confirm('هيتم استبدال كل البيانات الحالية بالنسخة دي. متأكد؟'))return;const pp=S.pin;S=d;S.pin=pp;mig();rm=S.meals[0]&&S.meals[0].id;save();draw();alert('تم الاستيراد ✅')}catch(e){alert('الملف ده مش نسخة احتياطية صحيحة')}};r.readAsText(file)};

 dl('taza-orders.csv','\ufeff'+[h].concat(S.orders.flatMap(o=>o.items.map(x=>[o.d,o.t,cn(o.cu),x.n,x.q,x.s,x.c,(x.s-x.c)*x.q,o.v||0,o.st,o.pay]))).map(r=>r.map(q).join(',')).join('\r\n'),'text/csv')};
const SB='https://pvkattydiwmdxfxbbhhg.supabase.co/rest/v1/taza_state',KEY='sb_publishable_fwjOl11Yw0P084GI4zo1Rw_ifBbBMxt';
function merge(r){
 const del=new Set([...(S.del||[]),...(r.del||[])]);S.del=[...del];
 const nr=(r.ts||0)>(S.ts||0),un=(a,b)=>{const m=new Map();(nr?(a||[]).concat(b||[]):(b||[]).concat(a||[])).forEach(x=>{if(!del.has(x.id))m.set(x.id,x)});return[...m.values()]};
 S.orders=un(S.orders,r.orders);S.cust=un(S.cust,r.cust);
 if(nr){S.ing=r.ing;S.meals=r.meals;S.ts=r.ts}
 mig();if(!S.meals.find(m=>m.id===rm))rm=S.meals[0]&&S.meals[0].id;
}
async function sync(){
 if(!sc||busy)return;busy=true;const before=JSON.stringify(S);
 try{
  const H={apikey:KEY,'Content-Type':'application/json','x-sync-code':sc};
  const r=await fetch(SB+'?id=eq.'+encodeURIComponent(sc)+'&select=data',{headers:H});
  if(!r.ok)throw new Error(r.status);
  const j=await r.json();if(j.length)merge(j[0].data);
  const p=await fetch(SB,{method:'POST',headers:{...H,Prefer:'resolution=merge-duplicates'},body:JSON.stringify({id:sc,data:{...S,pin:''},updated_at:new Date().toISOString()})});
  if(!p.ok)throw new Error(p.status);
  persist();sy='✅ آخر مزامنة '+tstr(new Date());
 }catch(e){sy='⚠️ فشلت المزامنة ('+(e.message||'النت')+')'+(e.message=='404'?' - الجدول مش موجود، شغّل كود SQL':'')}
 busy=false;if(JSON.stringify(S)!==before||tab=='b')draw();
}
