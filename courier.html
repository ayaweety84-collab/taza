<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f8f5ee"><meta name="robots" content="noindex"><title>صفحة المندوب — طازة</title>
<style>
:root{--bg:#f8f5ee;--cd:#fffdf9;--tx:#3a2d27;--mu:#7b6f66;--ac:#465e44;--or:#dd7f2c;--bd:#e5dccd;--rd:#b95441;--ok:#2f7d4f}
@media (prefers-color-scheme:dark){:root{--bg:#181c17;--cd:#232921;--tx:#f3eee4;--mu:#a7ae9f;--ac:#587a55;--bd:#353d31;--rd:#e07a68;--ok:#6fcf97}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:Tahoma,Arial,sans-serif;padding-bottom:30px}
.hd{background:#f8f5ee;border-bottom:4px solid var(--or);padding:8px 14px;padding-top:calc(8px + env(safe-area-inset-top,0px));display:flex;justify-content:space-between;align-items:center}.hd img{height:42px}.hd b{color:#465e44}
main{max-width:560px;margin:auto;padding:14px}.card{background:var(--cd);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 2px 10px rgba(58,45,39,.08)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.btn{flex:1;min-width:130px;padding:14px;border:0;border-radius:12px;background:var(--ac);color:#fff;font:inherit;font-weight:700;font-size:16px;text-align:center;text-decoration:none;cursor:pointer}.btn.sec{background:var(--bg);color:var(--tx);border:1px solid var(--bd)}.btn.or{background:var(--or)}.btn:disabled{opacity:.45}
h1{font-size:22px;margin:0 0 4px}.mu{color:var(--mu);font-size:14px}.big{font-size:19px;font-weight:700}.pill{display:inline-block;padding:3px 12px;border-radius:20px;background:#fdebd3;color:#8a4b0a;font-weight:700;font-size:13px}.pill.ok{background:#e7f3ea;color:#25613d}
.money{background:#fff6e5;border:2px dashed var(--or);border-radius:14px;padding:14px;text-align:center;color:#6a3c06}.money.paid{background:#e7f3ea;border-color:var(--ok);color:#25613d}.money b{font-size:26px;display:block}
ul{margin:8px 0 0;padding:0;list-style:none}li{padding:8px 0;border-bottom:1px dashed var(--bd);font-size:17px}li:last-child{border:0}#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1f1a17;color:#fff;padding:10px 18px;border-radius:20px;opacity:0;transition:.25s;pointer-events:none}#toast.show{opacity:1}
</style></head><body>
