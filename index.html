<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>مطبخ طازة</title>
<style>
:root{--bg:#f8f5ee;--cd:#fffdf9;--tx:#3a2d27;--mu:#7b6f66;--ac:#465e44;--or:#dd7f2c;--bd:#e5dccd;--rd:#b95441}
@media (prefers-color-scheme:dark){:root{--bg:#181c17;--cd:#232921;--tx:#f3eee4;--mu:#a7ae9f;--ac:#587a55;--bd:#353d31;--rd:#e07a68}}

.c{background:var(--cd);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:12px}

.t{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}

.w{color:var(--rd);font-weight:700}.tk{width:72mm;max-width:100%}
